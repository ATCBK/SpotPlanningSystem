<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D饼图</title>
    <!-- 引入ECharts核心库与3D扩展库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
        }
        .chart-container {
            width: 650px;
            height: 550px;
        }
    </style>
</head>
<body>
    <!-- 第一个：职称结构3D饼图 -->
    <div id="titleChart" class="chart-container"></div>
    <!-- 第二个：年龄结构3D饼图 -->
    <div id="ageChart" class="chart-container"></div>

    <script>
        // ================== 职称结构3D饼图 ==================
        const titleChart = echarts.init(document.getElementById('titleChart'));
        const titleOption = {
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c}人 ({d}%)',
                textStyle: { fontWeight: 'bold' }
            },
            series: [{
                type: 'pie3D',
                radius: '70%',
                center: ['50%', '50%'],
                depth: 35, // 3D立体厚度
                shading: 'realistic', // 真实光影效果
                itemStyle: { borderColor: '#fff', borderWidth: 2 },
                label: {
                    show: true,
                    position: 'outside',
                    formatter: '{b}{c}人\n{d}%',
                    fontWeight: 'bold', // 标签字重加粗
                    fontSize: 20,
                    color: '#000'
                },
                labelLine: {
                    show: true,
                    length: 20,
                    length2: 15,
                    lineStyle: { width: 1.5 }
                },
                data: [
                    { value: 61, name: '助教', itemStyle: { color: '#8dd35f' } },
                    { value: 25, name: '讲师', itemStyle: { color: '#ffc107' } },
                    { value: 14, name: '副教授', itemStyle: { color: '#fd7e14' } },
                    { value: 4, name: '教授', itemStyle: { color: '#4285f4' } }
                ]
            }]
        };
        titleChart.setOption(titleOption);

        // ================== 年龄结构3D饼图 ==================
        const ageChart = echarts.init(document.getElementById('ageChart'));
        const ageOption = {
            tooltip: {
                trigger: 'item',
                formatter: '{b}: {c}人 ({d}%)',
                textStyle: { fontWeight: 'bold' }
            },
            series: [{
                type: 'pie3D',
                radius: '70%',
                center: ['50%', '50%'],
                depth: 35, // 3D立体厚度
                shading: 'realistic', // 真实光影效果
                itemStyle: { borderColor: '#fff', borderWidth: 2 },
                label: {
                    show: true,
                    position: 'outside',
                    formatter: '{b}{c}人\n{d}%',
                    fontWeight: 'bold', // 标签字重加粗
                    fontSize: 20,
                    color: '#000'
                },
                labelLine: {
                    show: true,
                    length: 20,
                    length2: 15,
                    lineStyle: { width: 1.5 }
                },
                data: [
                    { value: 58, name: '35岁以下', itemStyle: { color: '#4285f4' } },
                    { value: 14, name: '36-45岁', itemStyle: { color: '#fd7e14' } },
                    { value: 2, name: '46岁以上', itemStyle: { color: '#ffc107' } }
                ]
            }]
        };
        ageChart.setOption(ageOption);

        // 窗口大小变化时自适应图表
        window.addEventListener('resize', () => {
            titleChart.resize();
            ageChart.resize();
        });
    </script>
</body>
</html>
